name: Build Green Excel APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK & AAB
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build Play Store App Bundle (AAB)
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Green-Excel-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

    - name: Upload Play Store AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: Green-Excel-PlayStore-AAB
        path: build/app/outputs/bundle/release/app-release.aab
        retention-days: 30
